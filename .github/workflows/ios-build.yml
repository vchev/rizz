# Builds the iPhone app and runs its unit tests on a Mac in the cloud,
# so app changes are checked even when nobody has Xcode open.
name: iOS build

on:
  push:
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build app and share extension
        run: |
          xcodebuild build \
            -project ios/ReplyAssistant.xcodeproj \
            -scheme ReplyAssistant \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 60
          exit ${PIPESTATUS[0]}
      - name: Run unit and UI tests
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/ui-screenshots
        run: |
          SIM=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [^(]*' | sed 's/ *$//')
          echo "Using simulator: $SIM"
          set +e
          xcodebuild test \
            -project ios/ReplyAssistant.xcodeproj \
            -scheme ReplyAssistant \
            -destination "platform=iOS Simulator,name=$SIM" \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1
          STATUS=$?
          tail -n 80 test.log
          # Why a test failed: assertion lines and each test's result.
          echo "---- Failures ----"
          grep -E "error: |XCTAssert|Test Case .*(failed|passed)" test.log | tail -n 60 || true
          exit $STATUS
      - name: Keep the app screenshots from the UI test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: ui-screenshots/
          if-no-files-found: ignore

  # Apple's age check (Declared Age Range) only exists in the newest Xcode,
  # so also build with whatever newest Xcode the cloud Mac has.
  build-newest-xcode:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pick the newest Xcode
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
      - name: Build app and extensions
        run: |
          xcodebuild build \
            -project ios/ReplyAssistant.xcodeproj \
            -scheme ReplyAssistant \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tail -n 60
          exit ${PIPESTATUS[0]}
